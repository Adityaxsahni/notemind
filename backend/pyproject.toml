[project]
name = "notemind-backend"
version = "0.1.0"
description = "NoteMind API and ingestion worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "rq>=1.16",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "anthropic>=1.0",
]

# CPU-only torch: the default Linux wheel bundles ~2 GB of CUDA libraries we never use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "bandit>=1.7",
    "fakeredis>=2.26",
]

[tool.uv]
package = false
# pymupdf 2.0 bundles an ONNX layout model that `import pymupdf` loads into every parsing job,
# though we never call page.get_layout(). Without onnxruntime that optional import fails and
# pymupdf skips it. Guarded by test_pdf_layout_model_is_not_loaded.
override-dependencies = [
    "pymupdf-layout; sys_platform == 'never'",
    "pymupdf4llm; sys_platform == 'never'",
    "onnxruntime; sys_platform == 'never'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: imports, B: bugbear, UP: pyupgrade, S: security (bandit rules)
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and deliberately fake secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow and not llm'"
markers = [
    "slow: loads the real embedding and reranker models (run with -m slow)",
    "llm: calls the real LLM API and costs money (run with -m llm; needs LLM_API_KEY)",
]
