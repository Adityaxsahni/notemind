name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: notemind
          POSTGRES_PASSWORD: ci-only-password  # pragma: allowlist secret
          POSTGRES_DB: notemind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notemind" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://notemind:ci-only-password@127.0.0.1:5432/notemind  # pragma: allowlist secret
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations apply, roll back, and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q
      - name: Static security scan (fail on high severity)
        run: uv run bandit -r app --severity-level high
      - name: Dependency vulnerability scan
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          # torch comes from PyTorch's CPU index as 2.x.y+cpu, which PyPI's advisory DB doesn't
          # know. Same source release, so audit it under the upstream version.
          sed -i -E 's/^(torch==[0-9.]+)\+cpu/\1/' requirements.txt
          uvx pip-audit -r requirements.txt --disable-pip --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability scan (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  eval-regression:
    # Retrieval quality gate: the seed question set through the real models and pgvector.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: notemind
          POSTGRES_PASSWORD: ci-only-password  # pragma: allowlist secret
          POSTGRES_DB: notemind
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notemind" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://notemind:ci-only-password@127.0.0.1:5432/notemind  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          # Bump when the pinned revisions in app/config.py change.
          key: hf-bge-small-5c38ec7-minilm-233902d
      - run: uv sync --frozen --project backend
      - name: Eval unit tests
        run: uv run --project backend pytest -q -p no:cacheprovider ml/eval/tests -c /dev/null --rootdir .
      - name: Seed-set retrieval must not regress
        run: >
          uv run --project backend python -m ml.eval.run retrieval --set seed --only baseline
          --no-tracking --min recall@6=0.95 --min mrr=0.9 --min refusal_recall=0.7
          --max false_refusal=0.05
