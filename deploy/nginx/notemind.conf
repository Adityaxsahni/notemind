# Edge proxy: the public entry point (behind your TLS terminator in production, and the
# target of the load test). Measured in docs/PERFORMANCE.md:
# - API paths go straight to the backend, so Node never relays JSON, uploads or streams.
# - Pages and build assets come from Next.js once, then from this cache: every page is a
#   static shell that loads its data in the browser, so all visitors get the same bytes.

# Re-resolve container names through Docker's DNS: a rebuilt backend or frontend gets a new
# address, and resolving only at startup sent every API call to the old one (502).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream notemind_backend {
    zone notemind_backend 64k;
    server backend:8000 resolve;
    keepalive 64;
}

upstream notemind_frontend {
    zone notemind_frontend 64k;
    server frontend:3000 resolve;
    keepalive 64;
}

proxy_cache_path /var/cache/nginx/notemind levels=1:2 keys_zone=notemind:10m max_size=256m
                 inactive=30m use_temp_path=off;

# The visitor's address is the TCP peer, unless a file in real-ip/ names a trusted proxy in
# front of this one (your TLS terminator; the load generator in docker-compose.loadtest.yml).
include /etc/nginx/real-ip/*.conf;

# Behind TLS termination, keep the scheme the visitor used (FORCE_HTTPS redirects on "http").
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 201m;  # 200 MB uploads; the backend enforces the exact limit

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Replace, never append: a client can't smuggle extra addresses into rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    location ~ ^/(auth|me|collections|invites|health|analytics|telemetry|admin)(/|$) {
        proxy_pass http://notemind_backend;
        proxy_buffering off;          # answers stream token by token
        proxy_request_buffering off;  # uploads stream through; the backend counts the bytes
        proxy_read_timeout 120s;
    }

    location /_next/static/ {
        proxy_pass http://notemind_frontend;
        proxy_cache notemind;
        proxy_cache_valid 200 30d;  # content-hashed file names: never change
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://notemind_frontend;
        proxy_cache notemind;
        # Next.js serves a page and its client-navigation payload (RSC) on the same URL.
        proxy_cache_key $scheme$host$request_uri$http_rsc$http_next_router_prefetch;
        # Short, so a deploy shows up within a minute. Next.js marks static pages cacheable
        # for a year, which suits a CDN that is purged on deploy, not this cache.
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 404 60s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status always;
    }
}
