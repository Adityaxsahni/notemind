# Main config for the edge proxy (the site itself is in notemind.conf). The image's default
# allows 1,024 connections per worker; each proxied request holds two (visitor + upstream),
# which a few thousand concurrent visitors exhaust.
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 10000;

    # Buffered: one write per 64 KB instead of one per request.
    access_log /dev/stdout combined buffer=64k flush=5s;
    error_log /dev/stderr warn;

    include /etc/nginx/conf.d/*.conf;
}
